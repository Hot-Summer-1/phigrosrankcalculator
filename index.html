<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phigros S / V 评级计算器</title>
  <meta name="description" content="输入物量与 ACC，计算取得 Phigros S / V 评级所需的最小最大连击数。">
  <link rel="icon" href="icon.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="container">
    <header class="hero">
      <h1>Phigros S / V 评级计算器</h1>
      <p class="subtitle">输入物量与 ACC，得到达成 S / V 评级所需的最小最大连击数</p>
    </header>

    <section class="card">
      <div class="fields">
        <div class="field">
          <label for="notes">物量（Note 总数）</label>
          <input id="notes" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 1024" autocomplete="off">
        </div>
        <div class="field">
          <label for="acc">ACC（%）</label>
          <input id="acc" type="number" min="0" max="100" step="0.01" inputmode="decimal" placeholder="例如 98.25" autocomplete="off">
        </div>
      </div>

      <div id="result" class="result">
        <p class="hint">输入物量与 ACC 后自动计算</p>
      </div>
    </section>

    <details class="card list-card">
      <summary>
        <span>参考表：各 ACC 所需最小连击</span>
      </summary>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ACC</th>
              <th>S 最小连击</th>
              <th>S 连击占比</th>
              <th>V 最小连击</th>
              <th>V 连击占比</th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
    </details>

    <footer class="footer">
      <a href="https://github.com/Hot-Summer-1/phigrosrankcalculator" target="_blank" rel="noopener noreferrer">
        <svg class="footer-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub 存储库</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
